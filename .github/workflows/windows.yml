name: Windows build and distribution checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Read dependency pin
        id: metadata
        shell: pwsh
        run: |
          $manifest = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          "baseline=$($manifest.'builtin-baseline')" >> $env:GITHUB_OUTPUT
          "version=$($manifest.'version-string')" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.metadata.outputs.baseline }}
          path: .vcpkg
      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          & ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$(Join-Path $PWD.Path '.vcpkg')" >> $env:GITHUB_ENV
      - name: Debug build and tests
        shell: pwsh
        run: |
          cmake --preset windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-debug --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --preset windows-debug --output-junit build/debug-tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Release build, tests and both installers
        shell: pwsh
        run: ./scripts/package_windows.ps1
      - name: Installer round trips
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          ./scripts/test_windows_installer.ps1 -Installer "build/distribution/KVM-Win-Setup-$env:RELEASE_VERSION.exe" -Role host -Version $env:RELEASE_VERSION -EvidenceDir build/installer-evidence
          ./scripts/test_windows_installer.ps1 -Installer "build/distribution/KVM-Agent-Setup-$env:RELEASE_VERSION.exe" -Role agent -Version $env:RELEASE_VERSION -EvidenceDir build/installer-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: KVM-Win-Windows-x64
          if-no-files-found: error
          path: |
            build/distribution/KVM-*-Setup-*.exe
            build/distribution/SHA256SUMS
            build/distribution/release-manifest.json
            build/distribution/INSTALLATION.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-validation
          path: |
            build/debug-tests.xml
            build/distribution/tests-release.xml
            build/windows/Testing/Temporary/LastTest.log
            build/installer-evidence/
# Publication exists only in release.yml's explicitly dispatched publish job.
