name: Windows build and portable tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC x64
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset windows
      - name: Build and test Debug
        run: |
          cmake --build --preset windows-debug --parallel 2
          ctest --preset windows-debug
      - name: Build and test Release
        run: |
          cmake --build --preset windows-release --parallel 2
          ctest --preset windows-release
      - name: Stage Qt and runtime dependencies
        run: cmake --install build/windows --config Release --prefix build/stage
      - name: GUI smoke test without input hooks
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          & ./build/stage/sharekeys_host.exe --smoke-test --identity "$env:RUNNER_TEMP/sharekeys-smoke"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/stage/sharekeys_agent.exe --smoke-test --identity "$env:RUNNER_TEMP/sharekeys-agent-smoke"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = '0.1.0' }
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DAppVersion=$version" "/DStageDir=$pwd/build/stage" installer/sharekeys.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ShareKeys-Windows-x64
          path: |
            build/stage/
            installer/Output/*.exe
            build/windows/Release/sharekeys_windows_input_test.exe
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ShareKeys-Windows-x64
          path: release-assets
      - name: Publish installer on version tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem -Path release-assets -Filter 'ShareKeys-*-x64.exe' -Recurse | Select-Object -First 1
          if (-not $installer) { throw 'Packaged ShareKeys installer was not found in the build artifact.' }
          gh release create $env:GITHUB_REF_NAME $installer.FullName --generate-notes
